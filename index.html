<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
  h2 { color: #1a365d; margin-bottom: 5px; text-transform: uppercase; font-size: 22px; }
  h4 { color: #742a2a; margin-top: 0; margin-bottom: 25px; font-weight: 600; }
  .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
  input[type="number"] { flex: 1; padding: 12px; border: 2px solid #cbd5e0; border-radius: 6px; font-size: 16px; outline: none; }
  input[type="number"]:focus { border-color: #1a365d; }
  button { background-color: #1a365d; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
  button:hover { background-color: #2b6cb0; }
  .result-card { display: none; border: 2px solid #1a365d; border-radius: 8px; padding: 20px; text-align: left; background: #fff; }
  .info-row { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; background: #edf2f7; padding: 10px; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
  th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: center; font-size: 14px; }
  th { background-color: #1a365d; color: white; }
  .summary { display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; background: #f7fafc; padding: 10px; border: 1px solid #e2e8f0; }
  .pass { color: green; }
  .fail { color: red; }
  .error { color: red; font-weight: bold; margin-top: 15px; display: none; }
  .print-btn { margin-top: 15px; width: 100%; background-color: #28a745; }
</style>
</head>
<body>

<div class="container">
  <h2>Usmania Public High School</h2>
  <h4>Class 8th Annual Result Portal 2026</h4>

  <div class="search-box">
    <input type="number" id="rollInput" placeholder="Enter Roll Number (1 - 50)">
    <button onclick="searchResult()">Check Result</button>
  </div>

  <div id="errorMessage" class="error">Invalid Roll Number! Please enter Roll No between 1 and 50.</div>

  <div id="resultCard" class="result-card">
    <div class="info-row">
      <span>Roll No: <span id="resRoll"></span></span>
      <span>Name: <span id="resName"></span></span>
      <span>Pos: <span id="resPos"></span></span>
    </div>

    <table>
      <thead>
        <tr><th>Subject</th><th>Total</th><th>Obtained</th></tr>
      </thead>
      <tbody id="marksBody"></tbody>
    </table>

    <div class="summary">
      <span>Total: <span id="resTot"></span>/500</span>
      <span>%: <span id="resPct"></span></span>
      <span>Grade: <span id="resGrd"></span></span>
      <span>Status: <span id="resSts"></span></span>
    </div>

    <button class="print-btn" onclick="window.print()">Print DMC</button>
  </div>
</div>

function searchResult() {
  const roll = parseInt(document.getElementById('rollInput').value);
  const student = studentsData.find(s => s.roll === roll);
  const card = document.getElementById('resultCard');
  const err = document.getElementById('errorMessage');

  if (student) {
    err.style.display = 'none';
    card.style.display = 'block';

    document.getElementById('resRoll').innerText = student.roll;
    document.getElementById('resName').innerText = student.name;
    document.getElementById('resPos').innerText = student.pos;
    document.getElementById('resTot').innerText = student.tot;
    document.getElementById('resPct').innerText = student.pct;
    document.getElementById('resGrd').innerText = student.grd;
    
    const stsElem = document.getElementById('resSts');
    stsElem.innerText = student.sts;
    stsElem.className = student.sts === 'Pass' ? 'pass' : 'fail';

    const tbody = document.getElementById('marksBody');
    tbody.innerHTML = `
      <tr><td>English</td><td>75</td><td>${student.eng}</td></tr>
      <tr><td>Urdu</td><td>75</td><td>${student.urd}</td></tr>
      <tr><td>Maths</td><td>75</td><td>${student.mat}</td></tr>
      <tr><td>Islamyat</td><td>50</td><td>${student.isl}</td></tr>
      <tr><td>Chemistry</td><td>75</td><td>${student.che}</td></tr>
      <tr><td>Biology</td><td>75</td><td>${student.bio}</td></tr>
      <tr><td>Physics</td><td>75</td><td>${student.phy}</td></tr>
    `;
  } else {
    card.style.display = 'none';
    err.style.display = 'block';
  }
}
