<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e8f7ff,#fff4df);color:#172033}
header{background:linear-gradient(135deg,#075985,#0f766e,#16a34a);color:#fff;text-align:center;padding:28px 15px}
header h1{margin:0;font-size:clamp(24px,5vw,40px)}header p{margin:8px 0 0;font-size:17px}
.container{max-width:1050px;margin:25px auto;padding:0 15px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0001;margin-bottom:22px}
.search{display:flex;gap:10px;flex-wrap:wrap}.search input{flex:1;min-width:220px;padding:15px;border:2px solid #dbeafe;border-radius:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:bold;cursor:pointer;background:#0f766e;color:#fff}.btn:hover{opacity:.9}.btn.secondary{background:#075985}
.notice{text-align:center;color:#64748b;padding:10px}.hidden{display:none}
.student-head{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;align-items:center}.student-head h2{margin:0;color:#075985}.badge{padding:8px 13px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:12px 10px;border-bottom:1px solid #e5e7eb;text-align:center}th{background:#075985;color:#fff}tr:nth-child(even){background:#f8fafc}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}.stat{background:linear-gradient(135deg,#eff6ff,#ecfeff);border-radius:14px;padding:16px;text-align:center}.stat b{display:block;font-size:24px;color:#075985;margin-top:5px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.dmc{max-width:850px;margin:0 auto;border:8px solid #075985;border-radius:18px;padding:24px;background:#fff}
.dmc-title{text-align:center;border-bottom:3px solid #0f766e;padding-bottom:15px}.dmc-title h1{margin:0;color:#075985}.dmc-title h3{margin:8px 0;color:#0f766e}.dmc-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.dmc-info div{padding:9px;background:#f1f5f9;border-radius:8px}.result-pass{color:#15803d;font-weight:bold}.result-fail{color:#b91c1c;font-weight:bold}
footer{text-align:center;padding:25px;color:#64748b}
@media(max-width:600px){.dmc{padding:12px;border-width:4px}.dmc-info{grid-template-columns:1fr}th,td{padding:9px 5px;font-size:13px}}
@media print{body{background:#fff}.no-print,header,.search-card,footer{display:none!important}.container{margin:0;max-width:none;padding:0}.card{box-shadow:none;margin:0}.dmc{border:5px solid #075985}}
</style>
</head>

const subjects=[
 ["English",75],["Urdu",75],["Maths",75],["Islamyat",50],
 ["Chemistry",75],["Biology",75],["Physics",75]
];

function totalMax(){return subjects.reduce((a,s)=>a+s[1],0)}
function studentTotal(st){return subjects.reduce((a,s)=>a+(Number(st.marks[s[0]])||0),0)}
function percent(st){return studentTotal(st)/totalMax()*100}
function grade(p){if(p>=80)return"A+";if(p>=70)return"A";if(p>=60)return"B";if(p>=50)return"C";if(p>=40)return"D";return"F"}
function status(st){return subjects.every(s=>(Number(st.marks[s[0]])||0)>=s[1]*.33)?"PASS":"FAIL"}

function searchResult(){
 const q=document.getElementById("searchInput").value.trim().toLowerCase();
 const st=students.find(x=>x.roll.toLowerCase()===q || x.name.toLowerCase().includes(q));
 const area=document.getElementById("resultArea");
 if(!st){area.className="card";area.innerHTML="<h3>❌ Student not found</h3><p>Please check Roll Number or Name.</p>";return}
 const total=studentTotal(st), max=totalMax(), p=percent(st), g=grade(p), stat=status(st);
 area.className="";
 area.innerHTML=`
 <div class="card">
  <div class="student-head"><div><h2>${st.name}</h2><p>Father: ${st.father} • Roll No: ${st.roll}</p></div>
  <span class="badge ${stat==="PASS"?"":"result-fail"}">${stat}</span></div>
  <table><thead><tr><th>Subject</th><th>Obtained</th><th>Total</th><th>%</th></tr></thead><tbody>
  ${subjects.map(s=>{let m=Number(st.marks[s[0]])||0;return `<tr><td>${s[0]}</td><td>${m}</td><td>${s[1]}</td><td>${(m/s[1]*100).toFixed(1)}%</td></tr>`}).join("")}
  </tbody></table>
  <div class="summary">
   <div class="stat">Total Marks<b>${total}/${max}</b></div>
   <div class="stat">Percentage<b>${p.toFixed(2)}%</b></div>
   <div class="stat">Grade<b>${g}</b></div>
   <div class="stat">Status<b>${stat}</b></div>
  </div>
  <div class="actions no-print"><button class="btn secondary" onclick="showDMC('${st.roll}')">🧾 View DMC</button><button class="btn" onclick="window.print()">🖨️ Print / Save PDF</button></div>
 </div>`;
 area.scrollIntoView({behavior:"smooth"});
}

function showDMC(roll){

}
